name: Feature request
description: Suggest an improvement or a new capability.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation and what gets in your way. Include the package or client if relevant.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: Describe the behavior you would like, and any workaround you use today.
    validations:
      required: true
