name: Harness verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The visual and process suites spawn the qd release binary
      # (packages/quickdraw/rust/qd/target/release/qd, see harness-tui present-visual/dump.ts).
      # It is not committed, so build it from the pinned toolchain.
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/quickdraw/rust/qd/target
          key: qd-${{ runner.os }}-${{ hashFiles('packages/quickdraw/rust/qd/Cargo.lock') }}
      - run: cargo build --release --manifest-path packages/quickdraw/rust/qd/Cargo.toml
      - run: pnpm install --frozen-lockfile
      # pnpm verify, as separate steps. Unit tests run two packages at a time: each vitest run
      # has its own workers, and more at once oversubscribes the 4-vCPU runner.
      - run: pnpm test:boundaries
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm turbo test --continue --concurrency=2
      - run: pnpm test:process
        if: ${{ !cancelled() }}
      - run: pnpm test:visual
        if: ${{ !cancelled() }}
