[package]
edition = "2024"
name = "irosashi"
version = "0.3.0"
publish = false
description = "TextMate grammar syntax highlighting with VS Code themes, pre-parsed binary corpus"
license = "MIT"

[features]
default = ["embedded-assets"]
embedded-assets = []

[lib]
name = "irosashi"
path = "src/lib.rs"

[dependencies]
bitflags = "2"
ferroni = "1.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
